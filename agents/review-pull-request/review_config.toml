# The agent's models (PMAT-312). Here, not in .env, so a model change is a commit and the eval gate sees it.
# The URL and token stay in .env (CODE_REVIEW_URL, CODE_REVIEW_TOKEN).
[model]
review = "nvidia/nemotron-3.5-super-vl:free"  # mesh review-pull-request (--model overrides it)
gate = "nvidia/nemotron-3.5-super-vl:free"    # the eval gate and run_eval.sh; eval/baseline.json must be on it

[limits]
max_tool_calls = 20
max_file_lines = 8000

[exclusions]
patterns = [
    "package-lock.json",
    "yarn.lock",
    "pnpm-lock.yaml",
    "*/dist/*",
    "*/build/*",
    "*/node_modules/*",
    "*.min.js",
    "*.min.css",
    "*.lock",
    "*.lockb",
    "npm-shrinkwrap.json",
    "go.sum",
]

[github]
token_env_var = "CODE_REVIEW_GITHUB_TOKEN"
repo = ""

[output]
file = "review_output.md"
