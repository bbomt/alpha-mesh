[project]
name = "review-pull-request"
version = "0.1.0"
description = "review-pull-request agent — LLM-powered code review with full codebase context"
requires-python = "~=3.12.0"
dependencies = [
    "boto3>=1.43.114",
    "httpx>=0.27.0",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-checkpoint-aws>=1.2.5",
    "openai>=2.45.0",
    "python-dotenv>=1.0.0",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pytest>=8.0.0",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_pull_request"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests", "eval/tests"]
