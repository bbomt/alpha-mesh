[project]
name = "pr-review"
version = "0.1.0"
description = "PR review agent - AI-powered code review via Claude Code"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "click>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
