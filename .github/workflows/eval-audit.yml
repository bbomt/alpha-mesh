# The eval audit (PMAT-312): on every push to master, check that each agent change came through a passing
# `mesh eval-gate`, and post the verdict as the commit status `eval-audit`. No model call: about a minute.
# A failure fails this run (GitHub emails the owner) and makes `mesh merge-pr` refuse other merges until
# `mesh eval-gate --master` passes or the revert lands. See agents/review-pull-request/eval/scripts/eval_audit.py.
name: eval-audit
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: "The master commit to audit (default: the branch head)"
        required: false
permissions:
  contents: read
  statuses: write
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: python3 agents/review-pull-request/eval/scripts/eval_audit.py "$GITHUB_REPOSITORY" "$SHA"
