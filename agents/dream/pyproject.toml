[project]
name = "dream"
version = "0.1.0"
description = "Dream agent - End-of-session memory consolidation"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
