# The required check `evals-gate` (PMAT-312): GitHub merges a PR into master only when this job passes.
# It runs on every PR, in seconds, and runs no eval itself:
#   - a PR that changes no agent file (list_evals_gated_files.py) passes at once;
#   - an agent PR passes when `mesh run-evals` (on the dev box: it needs the model key, the free quota and about
#     75 min) has posted the commit status `evals` = success on its head, or on an older commit with no agent file
#     changed since. Otherwise it fails and names the command to run. `mesh run-evals` re-runs this job when it posts.
# The filter is inside the job, not a `paths:` filter: a workflow skipped by `paths:` never reports, and a required
# check that never reports blocks the merge. The check runs the base branch's copy of its scripts, so a PR cannot
# loosen the check that judges it; a base without them fails the check, never running the PR's copy.
# PMAT-358: a PR into master comes from the queue eval-rc-q/current (its promotion PR) or a hotfix/* branch; any
# other head fails here, since mesh merge-pr moves a ticket's PR into the queue instead (EVAL-RC-Q.md).
# See agents/review-pull-request/eval/README.md, "The regression gate".
name: evals-gate
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
  pull-requests: read
  statuses: read
jobs:
  evals-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Evals passed, or not needed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            eval-rc-q/current|hotfix/*) ;;
            *) echo "ERROR: a PR into $BASE_REF comes from the queue eval-rc-q/current or a hotfix/* branch, not $HEAD_REF." >&2
               echo "mesh merge-pr moves this PR into the queue, whose gate runs the full evals (EVAL-RC-Q.md)." >&2
               exit 1 ;;
          esac
          scripts=agents/review-pull-request/eval/scripts
          git fetch -q --depth 1 origin "$BASE_REF"
          if ! git cat-file -e "FETCH_HEAD:$scripts/check_pr_evals.py" 2>/dev/null; then
            echo "ERROR: $BASE_REF has no $scripts/check_pr_evals.py; a PR is judged only by the base branch's copy." >&2
            exit 1
          fi
          git checkout -q FETCH_HEAD -- "$scripts/check_pr_evals.py" "$scripts/list_evals_gated_files.py"
          echo "Using $BASE_REF's check_pr_evals.py and list_evals_gated_files.py."
          python3 "$scripts/check_pr_evals.py" --evals-only "$PR_URL"
