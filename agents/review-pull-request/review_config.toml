# The agent's model (PMAT-312). Here, not in .env, so a model change is a commit and the eval gate sees it. One
# model for both: mesh review-pull-request uses it, and the evals and the gate measure it (eval/baseline.json must be
# on it). The URL and token stay in .env (CODE_REVIEW_URL, CODE_REVIEW_TOKEN).
[model]
review = "nvidia/nemotron-3.5-super-vl:free"  # --model overrides it for one review or eval run
# Sent on every model call (PMAT-338): the lowest, so repeats of a review differ as little as the model allows. It was a
# hardcoded 0.2 before. With a new model, check it accepts one ("temperature" in its supported_parameters on
# OpenRouter's /api/v1/models).
temperature = 0

[limits]
max_tool_calls = 20
max_file_lines = 8000

[exclusions]
patterns = [
    "package-lock.json",
    "yarn.lock",
    "pnpm-lock.yaml",
    "*/dist/*",
    "*/build/*",
    "*/node_modules/*",
    "*.min.js",
    "*.min.css",
    "*.lock",
    "*.lockb",
    "npm-shrinkwrap.json",
    "go.sum",
]

[github]
token_env_var = "CODE_REVIEW_GITHUB_TOKEN"
repo = ""

[output]
file = "review_output.md"
