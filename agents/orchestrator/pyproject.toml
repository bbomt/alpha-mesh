[project]
name = "orchestrator"
version = "0.1.0"
description = "mesh orchestrate — runs one Claude session per Jira ticket in its own tmux tab and passes on the owner's messages (PMAT-281 spike)"
requires-python = "~=3.12.0"
dependencies = [
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
